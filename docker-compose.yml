services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    # 只绑本机：对外由服务器上已有的 Caddy 反代
    ports:
      - "127.0.0.1:8787:8787"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waymuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waymuse}
      POSTGRES_DB: ${POSTGRES_DB:-waymuse}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waymuse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache-data:/data

  # 服务器上已经有 Caddy 时不要启动这个（会抢 80/443）。
  # 需要独立 Caddy 时：docker compose --profile with-caddy up -d
  caddy:
    profiles: ["with-caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  cache-data:
  caddy-data:
  caddy-config:
